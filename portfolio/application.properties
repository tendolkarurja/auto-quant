spring.application.name=portfolio
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/aq_portfolio?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Use the placeholder for the environment variable
spring.datasource.password=${DB_pass}

# Modern Hibernate doesn't need the 'MySQL8Dialect' string
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.example.portfolio=DEBUG

# CORS configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE
cors.allowed-headers=Content-Type,Authorization
cors.allow-credentials=true

# JWT configuration
jwt.secret=your_jwt_secret_key
jwt.expiration=3600000

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html



